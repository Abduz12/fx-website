[build]
  command = "npm install && npx drizzle-kit generate && npm run build"
  publish = "dist/public"

[functions]
  included_files = ["db/migrations/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
